# ~/.config/kitty/glassy-yellow.conf
# À inclure dans kitty.conf :  include glassy-yellow.conf
# Les couleurs reprennent theme/colors.css (kitty ne peut pas l'importer :
# en cas de changement de palette, mettre à jour ce fichier à la main).

# --- Base ---
foreground              #f2ecdc
background              #14130f
selection_foreground    #14130f
selection_background    #f5c518
cursor                  #f5c518
cursor_text_color       #14130f
url_color               #f5c518

# --- Effet verre ---
# Hyprland floute automatiquement les fenêtres translucides
# (decoration.blur.enabled = true).
background_opacity         0.80
dynamic_background_opacity yes

# --- Bordures ---
active_border_color     #f5c518
inactive_border_color   #6e6856
bell_border_color       #ff9f43

# --- Onglets ---
active_tab_foreground   #14130f
active_tab_background   #f5c518
inactive_tab_foreground #a8a08a
inactive_tab_background #1d1b15
tab_bar_background      #14130f

# --- Palette ANSI ---
# noir
color0   #1d1b15
color8   #6e6856
# rouge
color1   #ff6b5e
color9   #ff8a7e
# vert
color2   #9ccf6a
color10  #b5df8a
# jaune (accent)
color3   #f5c518
color11  #ffd84a
# bleu
color4   #7aa2d6
color12  #9bbce6
# magenta
color5   #c792b8
color13  #dcaed0
# cyan
color6   #6cc3b5
color14  #8fdccf
# blanc
color7   #d8d1bd
color15  #f2ecdc